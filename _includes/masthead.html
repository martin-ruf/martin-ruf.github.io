{% include base_path %}

<header class="masthead">
  <div class="academic-shell academic-header">
    <a class="academic-identity" href="{{ base_path }}/">
      <span class="academic-identity__name">{{ site.title }}</span>
      <span class="academic-identity__role">{{ site.author.bio }}</span>
    </a>

    <nav class="academic-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
